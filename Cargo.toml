[workspace]
members = [
    "dissonia",
    "dissonia-common",
    "dissonia-core",
    "dissonia-codec-pcm",
    "dissonia-codec-opus",
    "dissonia-codec-flac",
    "dissonia-format-riff",
    "dissonia-format-ogg",
    "dissonia-format-flac",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
version = "0.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
module_name_repetitions = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
dissonia-common = { version = "0.1.2", path = "dissonia-common" }
dissonia-core = { version = "0.1.2", path = "dissonia-core" }
dissonia-codec-pcm = { version = "0.1.2", path = "dissonia-codec-pcm" }
dissonia-codec-opus = { version = "0.1.2", path = "dissonia-codec-opus" }
dissonia-codec-flac = { version = "0.1.2", path = "dissonia-codec-flac" }
dissonia-format-riff = { version = "0.1.2", path = "dissonia-format-riff" }
dissonia-format-ogg = { version = "0.1.2", path = "dissonia-format-ogg" }
dissonia-format-flac = { version = "0.1.2", path = "dissonia-format-flac" }

[profile.release]
codegen-units = 1
lto = "thin"
